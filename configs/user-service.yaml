server:
  address: ":8081"
  read_header_timeout: 5
  idle_timeout: 60
  shutdown_timeout: 10

log:
  level: "info"
  format: "text"

database:
  connections:
    user:
      driver: mysql
      primary:
        dsn_env: GBT_DB_USER_PRIMARY_DSN
      replicas: [ ]
      pool:
        max_open_conns: 20
        max_idle_conns: 10
        conn_max_lifetime: 1800
        conn_max_idle_time: 600
      connect_timeout: 5
      slow_threshold: 200
